site_name: Wiki Ramas Estudiantiles IEEE Colombia
site_description: "Wiki para estudiantes, miembros, directivos y Consejeros de las Ramas Estudiantiles IEEE de Colombia: cómo unirte, qué hacer, cuándo y dónde encontrar la información oficial."
site_url: https://colombia-sac-team-2026.github.io/IEEEStudentsHandbook/
repo_url: https://github.com/Colombia-SAC-Team-2026/IEEEStudentsHandbook
repo_name: Colombia-SAC-Team-2026/IEEEStudentsHandbook
edit_uri: edit/main/docs/
copyright: >-
  IEEE Sección Colombia · SAC Team · <a href="mailto:sac@ieee.org.co">sac@ieee.org.co</a> ·
  <a href="https://sac.ieee.org.co">sac.ieee.org.co</a> ·
  <a href="https://forms.gle/Pcnj6NDTTKKTbPtP6">Feedback wiki</a><br>
  Basado en el Manual de Operaciones de MGA (2026) y recursos oficiales de IEEE · ¿Ves un error? Propón un cambio con el lápiz de cada página.

theme:
  name: material
  language: es
  logo: imagenes/ieeelogo.webp
  favicon: imagenes/ieeelogo.webp
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.indexes
    - content.tooltips
    - navigation.footer
    - content.action.edit
    - search.suggest
    - search.highlight

hooks:
  - hooks/search_fold.py

plugins:
  - search:
      lang: es

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

extra_css:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - javascripts/ramas-geo.js
  - javascripts/ramas.js
  - javascripts/checklist.js
  - javascripts/feedback.js

validation:
  links:
    anchors: warn


nav:
  - "Inicio": index.md
  - "Empezar en IEEE":
      - empezar/index.md
      - "IEEE en Colombia": empezar/ieee-colombia.md
      - "Cómo unirse a IEEE": empezar/unirse.md
      - "Participar como voluntario": empezar/participar.md
  - "Mi cargo":
      - mi-cargo/index.md
      - "Tu primer mes como directivo": mi-cargo/primer-mes.md
      - "Presidente de Rama": mi-cargo/presidente-rama.md
      - "Presidente de Capítulo": mi-cargo/presidente-capitulo.md
      - "Presidente de Grupo de Afinidad": mi-cargo/presidente-grupo-afinidad.md
      - "Vicepresidente": mi-cargo/vicepresidente.md
      - "Secretario": mi-cargo/secretario.md
      - "Tesorero": mi-cargo/tesorero.md
      - "Consejero de Rama": mi-cargo/consejero.md
  - "Operar la Rama":
      - operar/index.md
      - "Requisitos de una Rama": operar/requisitos.md
      - "Reportes y fechas límite": operar/reportes.md
      - "Junta directiva y funciones": operar/junta-directiva.md
      - "Elecciones y transición de la junta": operar/elecciones-y-transicion.md
  - "Eventos":
      - eventos/index.md
      - "Organizar un evento": eventos/organizar-evento.md
      - "Reportar un evento en vTools": eventos/reportar-evento.md
      - "Conseguir ponentes": eventos/conseguir-ponentes.md
  - "Dinero":
      - dinero/index.md
      - "Rebate: cómo se calcula y cómo cobrarlo": dinero/rebate.md
      - "Otras fuentes de financiación": dinero/otras-fuentes.md
  - "Membresía y captación":
      - membresia/index.md
      - "Año de membresía": membresia/anio-de-membresia.md
      - "Qué buscan los estudiantes": membresia/que-buscan-los-estudiantes.md
      - "Plan de captación y renovación": membresia/plan-de-captacion.md
  - "Capítulos y Grupos de Afinidad":
      - capitulos/index.md
      - "Cómo crear un Capítulo": capitulos/crear-capitulo.md
      - "Cómo crear un Grupo de Afinidad": capitulos/crear-grupo-afinidad.md
  - "Premios y Reconocimientos":
      - premios/index.md
      - "Premios del SAC Colombia": premios/premios-sac-colombia.md
      - "Premios regionales e internacionales": premios/premios-regionales.md
  - "Aprender más":
      - aprender/index.md
      - "Glosario": aprender/glosario.md
      - "Formación por cargo": aprender/formacion-por-cargo.md
      - "Catálogo de cursos del CLE": aprender/catalogo-cursos-cle.md
  - "Ayuda y recursos":
      - ayuda/index.md
      - "¿A quién preguntar?": ayuda/contacto.md
      - "Preguntas frecuentes": ayuda/faq.md
      - "Herramientas y marca": ayuda/herramientas-y-marca.md
      - "Enlaces oficiales": ayuda/enlaces.md
