site_name: Wiki Ramas Estudiantiles IEEE Colombia
site_description: "Wiki para directivos de Ramas Estudiantiles IEEE en Colombia: qué hacer, cuándo y dónde encontrar la información oficial."
site_url: https://colombia-sac-team-2026.github.io/IEEEStudentsHandbook/
repo_url: https://github.com/Colombia-SAC-Team-2026/IEEEStudentsHandbook
repo_name: Colombia-SAC-Team-2026/IEEEStudentsHandbook
edit_uri: edit/main/docs/
copyright: >-
  IEEE Sección Colombia · SAC Team · <a href="mailto:sac@ieee.org.co">sac@ieee.org.co</a> ·
  <a href="https://sac.ieee.org.co">sac.ieee.org.co</a> ·
  <a href="https://forms.gle/Pcnj6NDTTKKTbPtP6">Feedback wiki</a><br>
  Basado en el Manual de Operaciones de MGA (2026) y recursos oficiales de IEEE · ¿Ves un error? Propón un cambio con el lápiz de cada página.

theme:
  name: material
  language: es
  logo: imagenes/ieeelogo.webp
  favicon: imagenes/ieeelogo.webp
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.indexes
    - navigation.footer
    - content.action.edit
    - search.suggest
    - search.highlight

hooks:
  - hooks/search_fold.py

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

extra_css:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - javascripts/ramas-geo.js
  - javascripts/ramas.js
  - javascripts/checklist.js

nav:
  - Inicio: index.md
  - Conoce IEEE:
      - conoce-ieee/index.md
      - Cómo unirse a IEEE: conoce-ieee/unirse.md
      - IEEE Sección Colombia: conoce-ieee/seccion-colombia.md
      - Glosario: conoce-ieee/glosario.md
  - Cargos:
      - cargos/index.md
      - Presidente de Rama: cargos/presidente-rama.md
      - Presidente de Capítulo: cargos/presidente-capitulo.md
      - Presidente de Grupo de Afinidad: cargos/presidente-grupo-afinidad.md
      - Vicepresidente: cargos/vicepresidente.md
      - Secretario: cargos/secretario.md
      - Tesorero: cargos/tesorero.md
      - Consejero de Rama: cargos/consejero.md
  - Operación:
      - operacion/index.md
      - Requisitos de una Rama: operacion/requisitos.md
      - Reportes y fechas límite: operacion/reportes.md
      - Organizar un evento: operacion/organizar-evento.md
      - Reportar un evento en vTools: operacion/reportar-evento.md
      - Año de membresía: operacion/membresia.md
      - Captación y retención de miembros: operacion/captacion.md
      - Junta directiva y funciones: operacion/junta-directiva.md
      - Capítulos y Grupos de Afinidad: operacion/capitulos.md
      - Cómo crear un Capítulo: operacion/crear-capitulo.md
      - Elecciones: operacion/elecciones.md
      - Transición de la junta (empalme): operacion/empalme.md
  - Recursos:
      - recursos/index.md
      - Herramientas digitales: recursos/herramientas.md
      - Rebates y financiación: recursos/fondos.md
      - Premios y concursos: recursos/premios.md
      - Capacitación: recursos/capacitacion.md
      - Cursos del CLE: recursos/cursos-cle.md
      - Marca y comunicación: recursos/marca.md
      - ¿A quién preguntar?: recursos/contacto.md
      - Preguntas frecuentes: recursos/faq.md
      - Todos los enlaces: recursos/enlaces.md
