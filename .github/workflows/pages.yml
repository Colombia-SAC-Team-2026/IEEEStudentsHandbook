name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Static site, no build step. v4 skips dotfiles, so frontend/.vscode is not published.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
